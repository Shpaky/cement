name: Deploy to GitHub Pages
# Автоматически — по push в master. Вручную — из любой рабочей ветки:
# Actions → «Deploy to GitHub Pages» → Run workflow → выбрать ветку
# (или API: POST /actions/workflows/deploy.yml/dispatches {"ref": "<ветка>"}).
# Ветка должна быть разрешена в Settings → Environments → github-pages →
# Deployment branches. Следующий push в master перезапишет сайт.
run-name: Deploy ${{ github.ref_name }} (${{ github.event_name }})

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install, build, and upload site
        uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
